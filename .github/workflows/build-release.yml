name: Build and Release DMRGateway OPENWRT 22.03

on:
  push:
    tags:
      - 'v*' # 当推送形如 v1.0.0 的标签时触发发布
  workflow_dispatch: # 允许在 GitHub Actions 页面手动运行

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86
            subtarget: 64
            sdk_file: openwrt-sdk-22.03.5-x86-64_gcc-11.2.0_musl.Linux-x86_64.tar.xz
          - arch: mipsel_24kc
            target: ramips
            subtarget: mt7621
            sdk_file: openwrt-sdk-22.03.5-ramips-mt7621_gcc-11.2.0_musl.Linux-x86_64.tar.xz
          - arch: arm_cortex-a7
            target: ipq40xx
            subtarget: generic
            sdk_file: openwrt-sdk-22.03.5-ipq40xx-generic_gcc-11.2.0_musl_eabi.Linux-x86_64.tar.xz

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-dev python3-distutils \
            python3-setuptools python3-pip rsync subversion swig time \
            unzip wget xsltproc zlib1g-dev default-jdk

      - name: Download and Setup OpenWrt SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/22.03.5/targets/${{ matrix.target }}/${{ matrix.subtarget }}/${{ matrix.sdk_file }}"
          wget -qO sdk.tar.xz "$SDK_URL"
          tar xf sdk.tar.xz
          mv openwrt-sdk-* sdk

      - name: Generate DMRGateway Makefile
        run: |
          mkdir -p sdk/package/dmrgateway
          cat << 'EOF' > sdk/package/dmrgateway/Makefile
          include $(TOPDIR)/rules.mk
          
          PKG_NAME:=dmrgateway
          PKG_VERSION:=2026-05-22
          PKG_RELEASE:=1
          
          PKG_SOURCE:=master.tar.gz
          PKG_SOURCE_URL:=https://codeload.github.com/g4klx/DMRGateway/tar.gz/refs/heads
          PKG_HASH:=skip
          
          PKG_BUILD_DIR:=$(BUILD_DIR)/DMRGateway-master
          
          PKG_MAINTAINER:=
          PKG_LICENSE:=GPL-2.0-or-later
          PKG_LICENSE_FILES:=LICENSE
          
          include $(INCLUDE_DIR)/package.mk
          
          define Package/dmrgateway
            SECTION:=net
            CATEGORY:=Network
            TITLE:=DMRGateway
            URL:=https://github.com/g4klx/DMRGateway
            DEPENDS:=+libmosquitto
          endef
          
          define Package/dmrgateway/description
           DMRGateway bridges DMR networks and repeaters.
          endef
          
          define Build/Compile
          	$(MAKE) -C $(PKG_BUILD_DIR) \
          		CC="$(TARGET_CC)" \
          		CXX="$(TARGET_CXX)" \
          		CFLAGS="$(TARGET_CFLAGS) $(TARGET_CPPFLAGS) -std=gnu++11 -pthread" \
          		LDFLAGS="$(TARGET_LDFLAGS)" \
          		LIBS="-lpthread -lmosquitto"
          endef
          
          define Package/dmrgateway/install
          	$(INSTALL_DIR) $(1)/usr/bin
          	$(INSTALL_BIN) $(PKG_BUILD_DIR)/DMRGateway $(1)/usr/bin/
          endef
          
          $(eval $(call BuildPackage,dmrgateway))
          EOF

      - name: Update Feeds & Install mosquitto
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install libmosquitto

      - name: Compile DMRGateway
        working-directory: sdk
        run: |
          make defconfig
          make package/dmrgateway/compile V=s

      - name: Extract Binary
        run: |
          # 找到编译后的独立可执行文件
          BINARY_PATH=$(find sdk/build_dir/target-*/DMRGateway-master -name "DMRGateway" -type f -executable)
          echo "Found binary at $BINARY_PATH"
          cp "$BINARY_PATH" DMRGateway-${{ matrix.arch }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DMRGateway-${{ matrix.arch }}
          path: DMRGateway-${{ matrix.arch }}

  release:
    name: Release Binaries
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Display Downloaded Artifacts
        run: ls -R binaries

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'latest' }}
          generate_release_notes: true
          files: binaries/**/DMRGateway-*
